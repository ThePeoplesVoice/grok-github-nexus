name: Disabled — Firmware Build (Nexus is AI analysis, not firmware)

# Intentionally disabled. This file exists only to prevent GitHub Actions
# from treating a pure-comment file as an invalid workflow.
# The Nexus control plane uses the multi-ai-* analyzers exclusively.

on:
  workflow_dispatch:
    # Manual only — never runs on push/PR

permissions: {}

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Intentional no-op
        run: |
          echo "This workflow is permanently disabled for the Grok GitHub Nexus."
          echo "Use multi-ai-commit-analyzer, multi-ai-pr-analyzer, multi-ai-issue-triage instead."
