name: 🧭 Nexus Complete Analysis

on:
  schedule:
    - cron: '0 10 * * 4'  # Thursday 10:00 UTC — after the weekly pulse
  workflow_dispatch:

jobs:
  complete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: Run Complete Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nexus.scripts.run_complete_analysis

      - name: Commit complete_analysis.json (if changed)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/complete_analysis.json config/usage_stats.json config/reputation.json config/astra.json badges/reputation.md || true
          if git diff --staged --quiet; then
            echo "No complete-analysis artifact changes to commit"
          else
            git commit -m "chore: complete analysis — implementations + usage" || true
            git push || echo "⚠️ push failed (non-fatal)"
          fi

      - name: Post Complete Analysis Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = 'Complete analysis missing — see workflow logs.';
            try {
              body = fs.readFileSync('/tmp/nexus_complete.md', 'utf8');
            } catch (e) {
              body = `Complete analysis failed before report write.\n\n${e.message}`;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            for (const name of ['nexus-complete', 'automated']) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                await github.rest.issues.createLabel({
                  owner, repo, name,
                  color: name === 'nexus-complete' ? '3d9b8a' : '6a8f86',
                  description: name === 'nexus-complete' ? 'Complete Analysis implementation loop' : 'Automated Nexus run',
                }).catch(() => {});
              }
            }
            const title = `🧭 Nexus Complete Analysis — ${new Date().toISOString().slice(0, 10)}`;
            await github.rest.issues.create({
              owner, repo, title, body,
              labels: ['nexus-complete', 'automated']
            });
            console.log('✅ Complete analysis issue created');
