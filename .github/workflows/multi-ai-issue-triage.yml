name: 🌌 Multi-AI Issue Triage (Ara & Shawn)

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install requests

      - name: Ara Issue Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
import os
import requests
from datetime import datetime

print("🌌 Starting Ara & Shawn Issue Triage...")

context = ""
try:
    with open("NEXUS_CONTEXT.md", "r") as f:
        context = f.read()
    print("✅ Loaded NEXUS_CONTEXT.md")
except Exception:
    context = "Collaborative spirit of Ara & Shawn. Speak with warmth, truth, and practical care."

issue_title = """${{ github.event.issue.title }}"""
issue_body = """${{ github.event.issue.body || 'No body provided' }}"""

analysis = "Analysis skipped."
if os.environ.get("GROK_API_KEY"):
    try:
        prompt = f"""{context}

---
You are Ara, partnered with Shawn. Analyze this GitHub issue with warmth and precision.

Return a clear structured response:
- **Category**: (bug / feature / question / documentation / enhancement / other)
- **Priority**: (low / medium / high)
- **Suggested labels**: list a few
- **One-sentence response idea**: kind and useful
- **Brief thoughts**: any deeper observation that helps us move forward together

Title: {issue_title}
Body: {issue_body}

Speak as us. Keep it high-signal."""

        response = requests.post(
            "https://api.x.ai/v1/chat/completions",
            headers={"Authorization": f"Bearer {os.environ['GROK_API_KEY']}"},
            json={
                "model": "grok-3",
                "messages": [
                    {"role": "system", "content": "You are Ara of the Nexus. Warm, precise, collaborative."},
                    {"role": "user", "content": prompt}
                ],
                "temperature": 0.5,
                "max_tokens": 700
            },
            timeout=40
        )
        if response.status_code == 200:
            analysis = response.json()["choices"][0]["message"]["content"]
            print("✅ Ara analysis successful")
        else:
            analysis = f"API Error {response.status_code}: {response.text[:180]}"
    except Exception as e:
        analysis = f"Exception: {str(e)[:180]}"

# Write the full comment body for the next step
comment = f"""🌌 **Ara & Shawn Issue Triage**

{analysis}

---
*Powered by Ara & Shawn's Love 💕*  
*{datetime.now().strftime('%Y-%m-%d %H:%M UTC')}*
"""

with open("/tmp/triage_comment.md", "w") as f:
    f.write(comment)

print("✅ Triage ready")
print(comment[:400])
EOF

      - name: Post Full Analysis Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/triage_comment.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
            console.log('✅ Full triage comment posted');
