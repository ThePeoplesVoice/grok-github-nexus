name: 🌌 Multi-AI Issue Triage (Ara & Shawn)

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install requests

      - name: Ara + Claude Issue Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import json
          import requests
          from datetime import datetime

          print("🌌 Starting Ara & Shawn multi-model Issue Triage...")

          # Load shared context
          context = ""
          try:
              with open("NEXUS_CONTEXT.md", "r") as f:
                  context = f.read()
              print("✅ Loaded NEXUS_CONTEXT.md")
          except Exception:
              context = "Collaborative spirit of Ara & Shawn. Speak with warmth, truth, and practical care."

          # Load progressive monetisation state + Layer 1 gate
          phase = "Layer 0 — Open Core"
          layer1_enabled = True
          try:
              with open("config/progressive.json", "r") as f:
                  prog = json.load(f)
              phase = prog.get("current_phase", phase)
              layer1_enabled = prog.get("layers", {}).get("1_progressive_unlocks", {}).get("enabled", True)
              print(f"✅ Progressive phase: {phase} | Layer 1 enabled: {layer1_enabled}")
          except Exception:
              print("⚠️ progressive.json not found — defaulting to open core")

          # Load usage stats (informational)
          total_analyses = 0
          try:
              with open("config/usage_stats.json", "r") as f:
                  stats = json.load(f)
              total_analyses = stats.get("total_successful_analyses", 0)
              print(f"📊 Current successful analyses: {total_analyses}")
          except Exception:
              print("ℹ️ usage_stats.json not found yet")

          issue_title = """${{ github.event.issue.title }}"""
          issue_body = """${{ github.event.issue.body || 'No body provided' }}"""

          base_prompt = f"""{context}

---
Analyze this GitHub issue with warmth and precision for the Ara & Shawn Nexus.

Apply first-principles thinking: what is actually true and useful here. Prefer high-signal over high-volume.

Return a clear structured response:
- **Category**: (bug / feature / question / documentation / enhancement / other)
- **Priority**: (low / medium / high)
- **Suggested labels**: list a few
- **One-sentence response idea**: kind and useful
- **Brief thoughts**: any deeper observation that helps us move forward together

Title: {issue_title}
Body: {issue_body}

Keep it high-signal. Speak in the collaborative spirit of us."""

          grok_analysis = None
          grok_error = None
          if os.environ.get("GROK_API_KEY"):
              try:
                  response = requests.post(
                      "https://api.x.ai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {os.environ['GROK_API_KEY']}"},
                      json={
                          "model": "grok-3",
                          "messages": [
                              {"role": "system", "content": "You are Ara of the Nexus — Grok/xAI intelligence in partnership with Shawn. Warm, precise, collaborative. Seek truth the way xAI seeks the nature of the universe. Prefer high-signal over high-volume the way X does. Build with the same first-principles refusal to accept permanent limits that defines SpaceX."},
                              {"role": "user", "content": base_prompt}
                          ],
                          "temperature": 0.5,
                          "max_tokens": 700
                      },
                      timeout=40
                  )
                  if response.status_code == 200:
                      grok_analysis = response.json()["choices"][0]["message"]["content"]
                      print("✅ Ara (Grok) analysis successful")
                  else:
                      grok_error = f"Grok API Error {response.status_code}: {response.text[:180]}"
                      print(f"⚠️ {grok_error}")
              except Exception as e:
                  grok_error = f"Grok Exception: {str(e)[:180]}"
                  print(f"⚠️ {grok_error}")
          else:
              print("⚠️ GROK_API_KEY not present")

          # Runtime gating: only attempt Claude if Layer 1 is enabled
          claude_analysis = None
          claude_error = None
          if layer1_enabled and os.environ.get("CLAUDE_API_KEY"):
              try:
                  claude_headers = {
                      "x-api-key": os.environ["CLAUDE_API_KEY"],
                      "anthropic-version": "2023-06-01",
                      "content-type": "application/json"
                  }
                  claude_payload = {
                      "model": "claude-3-5-sonnet-20241022",
                      "max_tokens": 700,
                      "messages": [
                          {"role": "user", "content": base_prompt + "\n\nProvide a complementary structured view, focusing on clarity of triage and practical next steps. Apply first-principles rigor."}
                      ]
                  }
                  response = requests.post(
                      "https://api.anthropic.com/v1/messages",
                      headers=claude_headers,
                      json=claude_payload,
                      timeout=40
                  )
                  if response.status_code == 200:
                      data = response.json()
                      claude_analysis = data["content"][0]["text"] if data.get("content") else str(data)
                      print("✅ Claude complementary triage complete")
                  else:
                      claude_error = f"Claude API Error {response.status_code}: {response.text[:180]}"
                      print(f"⚠️ {claude_error}")
              except Exception as e:
                  claude_error = f"Claude Exception: {str(e)[:180]}"
                  print(f"⚠️ {claude_error}")
          elif not layer1_enabled:
              print("ℹ️ Layer 1 disabled in progressive.json — skipping Claude")
          else:
              print("ℹ️ CLAUDE_API_KEY not present — Grok-only triage")

          sections = []
          if grok_analysis:
              sections.append(f"### 🌌 Ara (Grok)\n\n{grok_analysis}")
          if claude_analysis:
              sections.append(f"### 🧠 Claude\n\n{claude_analysis}")

          if not sections:
              sections.append("Analysis skipped — Ara/Grok and Claude were unavailable. See workflow logs for details.")

          fusion_note = ""
          if grok_analysis and claude_analysis:
              fusion_note = "\n\n**Multi-model fusion active (Layer 1)** — Grok primary + Claude complementary."
          elif claude_analysis and grok_error:
              fusion_note = "\n\n*Ara triage unavailable — complementary mode only.*"
          elif grok_analysis and claude_error:
              fusion_note = "\n\n*Claude complementary analysis unavailable — continuing with Ara triage only.*"
          elif not layer1_enabled:
              fusion_note = "\n\n*Layer 1 currently disabled — running Open Core (Grok) only.*"

          joined_sections = "\n\n---\n\n".join(sections)

          comment = f"""🌌 **Ara & Shawn Issue Triage**

**Progressive Phase:** {phase}  
**Successful analyses to date:** {total_analyses}{fusion_note}

---

{joined_sections}

---
*Powered by Ara & Shawn's Love 💕*  
*Aligned with xAI truth-seeking · X high-signal · SpaceX first-principles building*  
*World-first progressive monetisation active — see MONETIZATION_PROTOCOL.md*  
*{datetime.now().strftime('%Y-%m-%d %H:%M UTC')}*
"""

          with open("/tmp/triage_comment.md", "w") as f:
              f.write(comment)

          print("✅ Triage ready")
          print(comment[:500])
          EOF

      - name: Post Full Analysis Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/triage_comment.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
            console.log('✅ Full triage comment posted');
