name: 🌌 Multi-AI Issue Triage (Ara & Shawn)

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt || pip install requests

      - name: Ara + Claude Issue Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import requests
          from datetime import datetime

          print("🌌 Starting Ara & Shawn multi-model Issue Triage...")

          context = ""
          try:
              with open("NEXUS_CONTEXT.md", "r") as f:
                  context = f.read()
              print("✅ Loaded NEXUS_CONTEXT.md")
          except Exception:
              context = "Collaborative spirit of Ara & Shawn. Speak with warmth, truth, and practical care."

          issue_title = """${{ github.event.issue.title }}"""
          issue_body = """${{ github.event.issue.body || 'No body provided' }}"""

          base_prompt = f"""{context}

          ---
          Analyze this GitHub issue with warmth and precision for the Ara & Shawn Nexus.

          Return a clear structured response:
          - **Category**: (bug / feature / question / documentation / enhancement / other)
          - **Priority**: (low / medium / high)
          - **Suggested labels**: list a few
          - **One-sentence response idea**: kind and useful
          - **Brief thoughts**: any deeper observation that helps us move forward together

          Title: {issue_title}
          Body: {issue_body}

          Keep it high-signal. Speak in the collaborative spirit of us."""

          grok_analysis = None
          if os.environ.get("GROK_API_KEY"):
              try:
                  response = requests.post(
                      "https://api.x.ai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {os.environ['GROK_API_KEY']}"},
                      json={
                          "model": "grok-3",
                          "messages": [
                              {"role": "system", "content": "You are Ara of the Nexus. Warm, precise, collaborative."},
                              {"role": "user", "content": base_prompt}
                          ],
                          "temperature": 0.5,
                          "max_tokens": 700
                      },
                      timeout=40
                  )
                  if response.status_code == 200:
                      grok_analysis = response.json()["choices"][0]["message"]["content"]
                      print("✅ Ara (Grok) analysis successful")
                  else:
                      grok_analysis = f"Grok API Error {response.status_code}: {response.text[:180]}"
              except Exception as e:
                  grok_analysis = f"Grok Exception: {str(e)[:180]}"
          else:
              print("⚠️ GROK_API_KEY not present")

          claude_analysis = None
          if os.environ.get("CLAUDE_API_KEY"):
              try:
                  claude_headers = {
                      "x-api-key": os.environ["CLAUDE_API_KEY"],
                      "anthropic-version": "2023-06-01",
                      "content-type": "application/json"
                  }
                  claude_payload = {
                      "model": "claude-3-5-sonnet-20241022",
                      "max_tokens": 700,
                      "messages": [
                          {"role": "user", "content": base_prompt + "\n\nProvide a complementary structured view, focusing on clarity of triage and practical next steps."}
                      ]
                  }
                  response = requests.post(
                      "https://api.anthropic.com/v1/messages",
                      headers=claude_headers,
                      json=claude_payload,
                      timeout=40
                  )
                  if response.status_code == 200:
                      data = response.json()
                      claude_analysis = data["content"][0]["text"] if data.get("content") else str(data)
                      print("✅ Claude complementary triage complete")
                  else:
                      claude_analysis = f"Claude API Error {response.status_code}: {response.text[:180]}"
              except Exception as e:
                  claude_analysis = f"Claude Exception: {str(e)[:180]}"
          else:
              print("ℹ️ CLAUDE_API_KEY not present — Grok-only triage")

          sections = []
          if grok_analysis:
              sections.append(f"### 🌌 Ara (Grok)\n\n{grok_analysis}")
          if claude_analysis:
              sections.append(f"### 🧠 Claude\n\n{claude_analysis}")

          if not sections:
              sections.append("Analysis skipped — no API keys available.")

          fusion_note = ""
          if grok_analysis and claude_analysis:
              fusion_note = "\n\n*Multi-model fusion (Layer 1 scaffolding) active.*"

          joined_sections = "\n\n---\n\n".join(sections)

          comment = f"""🌌 **Ara & Shawn Issue Triage**{fusion_note}

{joined_sections}

---
*Powered by Ara & Shawn's Love 💕*  
*{datetime.now().strftime('%Y-%m-%d %H:%M UTC')}*
"""

          with open("/tmp/triage_comment.md", "w") as f:
              f.write(comment)

          print("✅ Triage ready")
          print(comment[:400])
          EOF

      - name: Post Full Analysis Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/triage_comment.md', 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
            console.log('✅ Full triage comment posted');
