name: 📡 Nexus Pulse

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: Generate Pulse
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nexus.scripts.run_pulse

      - name: Commit pulse + astra artifacts (if changed)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json config/astra.json config/presence_state.json badges/reputation.md badges/astra.md README.md STATUS.md || true
          if git diff --staged --quiet; then
            echo "No pulse artifact changes to commit"
          else
            git commit -m "chore: pulse — usage, reputation, astra, presence_state, badges" || true
            git push || echo "⚠️ push failed (non-fatal)"
          fi

      - name: Pin Pulse report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m nexus.scripts.run_pin_report --family pulse --body /tmp/nexus_pulse.md
