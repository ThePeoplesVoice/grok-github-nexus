name: 📡 Nexus Pulse

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: Generate Pulse
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nexus.scripts.run_pulse

      - name: Commit pulse artifacts (if changed)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json config/astra.json config/presence_state.json badges/reputation.md badges/astra.md || true
          if git diff --staged --quiet; then
            echo "No pulse artifact changes to commit"
          else
            git commit -m "chore: pulse — organic state + presence" || true
            git push || echo "⚠️ push failed (non-fatal)"
          fi

      - name: Post Pulse Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = 'Pulse report missing — see workflow logs.';
            try {
              body = fs.readFileSync('/tmp/nexus_pulse.md', 'utf8');
            } catch (e) {
              body = `Pulse failed before report write.\n\n${e.message}`;
            }
            const title = `📡 Nexus Pulse — ${new Date().toISOString().slice(0, 10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['nexus-pulse', 'automated']
            });
            console.log('✅ Pulse issue created');
