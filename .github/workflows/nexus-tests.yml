name: 🧪 Nexus Tests

on:
  push:
    branches: [main, develop, master]
    paths:
      - 'nexus/**'
      - 'tests/**'
      - 'setup.py'
      - 'requirements.txt'
  # No path filter on pull_request: "test" is a required check on main, and a
  # required check that never starts leaves the PR blocked on "Expected".
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
