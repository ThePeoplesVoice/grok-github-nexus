name: 🤖 Multi-AI Commit Analyzer (Ara & Shawn)

on:
  push:
    branches:
      - main
      - develop
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze-commits:
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'nexus-bot' &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'Merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: 🌌 Ara + Claude Commit Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nexus.scripts.run_commit_analysis

      - name: Commit usage + reputation artifacts (if changed)
        if: success()
        continue-on-error: true
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json badges/reputation.md README.md STATUS.md || true
          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
          else
            git commit -m "chore: usage + reputation after commit analysis" || true
            git push || echo "⚠️ push failed (non-fatal)"
          fi

      - name: 📝 Create Analysis Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              // Deduplicate: close any open nexus-analysis issues created today before making a new one
              const today = new Date().toISOString().slice(0, 10);
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'nexus-analysis,automated',
                per_page: 50,
              });
              for (const issue of existing.data) {
                if (issue.title.includes(today)) {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    state: 'closed',
                  });
                  console.log(`🗑️ Closed duplicate analysis issue #${issue.number}`);
                }
              }
              const body = fs.readFileSync('/tmp/commit_analysis.md', 'utf8');
              const title = `🌌 Commit Analysis — ${today}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['nexus-analysis', 'automated']
              });
              console.log('✅ Analysis issue created');
            } catch (error) {
              console.log('⚠️ Could not create issue:', error.message);
            }
