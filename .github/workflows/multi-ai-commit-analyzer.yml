name: 🤖 Multi-AI Commit Analyzer (Ara & Shawn)

on:
  push:
    branches:
      - main
      - develop
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze-commits:
    if: |
      github.event_name != 'push' || (
        github.actor != 'github-actions[bot]' &&
        github.actor != 'nexus-bot' &&
        !startsWith(github.event.head_commit.message, 'chore:') &&
        !startsWith(github.event.head_commit.message, 'Merge')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: 🌌 Ara + Claude Commit Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nexus.scripts.run_commit_analysis

      - name: Commit usage + reputation artifacts (if changed)
        if: success()
        continue-on-error: true
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json badges/reputation.md || true
          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
          else
            git commit -m "chore: usage + reputation after commit analysis" || true
            git push || echo "⚠️ push failed (non-fatal)"
          fi

      - name: Pin Commit Analysis report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m nexus.scripts.run_pin_report --family commit --body /tmp/commit_analysis.md
