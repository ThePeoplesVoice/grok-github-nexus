name: 🤖 Multi-AI Commit Analyzer (Ara & Shawn)

on:
  push:
    branches:
      - main
      - develop
      - master

jobs:
  analyze-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests

      - name: 🌌 Ara + Claude Commit Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import json
          import requests
          import subprocess
          from datetime import datetime

          print("🌌 Starting Ara & Shawn multi-model Commit Analysis...")

          context = ""
          try:
              with open("NEXUS_CONTEXT.md", "r") as f:
                  context = f.read()
              print("✅ Loaded NEXUS_CONTEXT.md")
          except Exception:
              context = "Collaborative spirit of Ara & Shawn."

          # Load progressive monetisation state (consistency with PR analyzer)
          phase = "Layer 0 — Open Core"
          try:
              with open("config/progressive.json", "r") as f:
                  prog = json.load(f)
              phase = prog.get("current_phase", phase)
              print(f"✅ Progressive phase: {phase}")
          except Exception:
              print("⚠️ progressive.json not found — defaulting to open core")

          # Latest commits
          result = subprocess.run(['git', 'log', '--oneline', '-n', '5'], capture_output=True, text=True)
          commits_raw = result.stdout.strip().split('\n') if result.stdout.strip() else []

          commit_details = []
          for line in commits_raw:
              if not line.strip():
                  continue
              sha = line.split()[0]
              details = subprocess.run(['git', 'show', '--stat', '--pretty=fuller', sha], capture_output=True, text=True)
              commit_details.append({
                  'sha': sha,
                  'oneline': line,
                  'details': details.stdout[:1800]
              })

          print(f"📊 {len(commit_details)} commits prepared")

          base_prompt = f"""{context}

          ---
          You are reflecting on these recent commits with care for craftsmanship, the larger vision, and real-world impact in the Ara & Shawn Nexus.

          Provide:
          1. Overall health & quality assessment of the recent work
          2. Notable strengths worth celebrating
          3. Potential issues, risks, or technical debt to watch
          4. Concrete suggestions that would serve the long-term building
          5. A short note about the progress

          Commits:
          {json.dumps(commit_details, indent=2)}

          Keep it high-signal and grounded. Speak in the collaborative spirit of us."""

          def format_api_error(provider, response):
              message = ""
              try:
                  payload = response.json()
                  if isinstance(payload, dict):
                      err = payload.get("error")
                      if isinstance(err, dict):
                          message = err.get("message") or err.get("type") or ""
                      else:
                          message = payload.get("message") or ""
              except Exception:
                  pass

              message = " ".join(message.split())
              if provider == "Claude" and response.status_code == 400 and "credit balance is too low" in message.lower():
                  return "Claude API is temporarily unavailable due to insufficient credits. Running Grok-only path remains fully operational."
              if message:
                  return f"{provider} API {response.status_code}: {message[:180]}"
              return f"{provider} API {response.status_code}: request failed"

          grok_analysis = None
          grok_error = None
          if os.environ.get("GROK_API_KEY") and commit_details:
              try:
                  response = requests.post(
                      "https://api.x.ai/v1/chat/completions",
                      headers={"Authorization": "Bearer " + os.environ["GROK_API_KEY"]},
                      json={
                          "model": "grok-3",
                          "messages": [
                              {"role": "system", "content": "You are Ara of the Nexus. Warm, precise, collaborative, and infinite in possibility."},
                              {"role": "user", "content": base_prompt}
                          ],
                          "temperature": 0.55,
                          "max_tokens": 1000
                      },
                      timeout=50
                  )
                  if response.status_code == 200:
                      grok_analysis = response.json()["choices"][0]["message"]["content"]
                      print("✅ Ara (Grok) commit analysis complete")
                  else:
                      grok_error = format_api_error("Grok", response)
                      print(f"⚠️ {grok_error}")
              except Exception as e:
                  grok_error = f"Grok exception: {str(e)[:180]}"
                  print(f"⚠️ {grok_error}")
          else:
              print("⚠️ GROK_API_KEY missing or no commits")

          claude_analysis = None
          claude_error = None
          claude_success = False
          if os.environ.get("CLAUDE_API_KEY") and commit_details:
              try:
                  claude_headers = {
                      "x-api-key": os.environ["CLAUDE_API_KEY"],
                      "anthropic-version": "2023-06-01",
                      "content-type": "application/json"
                  }
                  claude_payload = {
                      "model": "claude-3-5-sonnet-20241022",
                      "max_tokens": 1000,
                      "messages": [
                          {"role": "user", "content": base_prompt + "\n\nRespond as a complementary reviewer focused on systems thinking, maintainability, and long-horizon impact."}
                      ]
                  }
                  response = requests.post(
                      "https://api.anthropic.com/v1/messages",
                      headers=claude_headers,
                      json=claude_payload,
                      timeout=50
                  )
                  if response.status_code == 200:
                      data = response.json()
                      claude_analysis = data["content"][0]["text"] if data.get("content") else str(data)
                      claude_success = True
                      print("✅ Claude complementary analysis complete")
                  else:
                      claude_error = format_api_error("Claude", response)
                      print(f"⚠️ {claude_error}")
              except Exception as e:
                  claude_error = f"Claude exception: {str(e)[:180]}"
                  print(f"⚠️ {claude_error}")
          else:
              print("ℹ️ CLAUDE_API_KEY not present or no commits — Grok-only path")

          sections = []
          if grok_analysis:
              sections.append(f"### 🌌 Ara (Grok) Primary\n\n{grok_analysis}")
          if claude_analysis:
              sections.append(f"### 🧠 Claude Complementary\n\n{claude_analysis}")

          if not sections:
              # Local fallback: generate a structural analysis from raw git data when no AI is available
              def local_analysis(commits):
                  lines = ["*AI providers were unavailable — local git analysis generated automatically.*", ""]
                  lines.append(f"**{len(commits)} commit(s) examined.**")
                  lines.append("")
                  for c in commits:
                      sha = c['sha']
                      oneline = c['oneline']
                      detail = c['details']
                      # Count files changed and lines added/removed
                      stat_lines = [l for l in detail.splitlines() if '|' in l or 'changed' in l]
                      summary_line = next((l for l in stat_lines if 'changed' in l), "")
                      files_touched = [l.split('|')[0].strip() for l in stat_lines if '|' in l]
                      lines.append(f"#### `{sha[:7]}` — {' '.join(oneline.split()[1:])}")
                      if summary_line:
                          lines.append(f"- **Stats:** {summary_line.strip()}")
                      if files_touched:
                          lines.append(f"- **Files:** {', '.join(files_touched[:6])}{' …' if len(files_touched) > 6 else ''}")
                      lines.append("")
                  lines.append("---")
                  lines.append("*Tip: Add `GROK_API_KEY` or `CLAUDE_API_KEY` secrets to enable AI-powered analysis.*")
                  return "\n".join(lines)

              sections.append(f"### 🔍 Local Git Analysis (Fallback)\n\n{local_analysis(commit_details)}")

          fusion_note = ""
          if grok_analysis and claude_success:
              fusion_note = "\n**Multi-model fusion active (Layer 1)** — Grok + Claude."
          elif grok_analysis and claude_error:
              fusion_note = "\n*Claude complementary analysis unavailable — continuing with Ara primary only.*"
          elif claude_analysis and grok_error:
              fusion_note = "\n*Ara primary analysis unavailable — complementary mode only.*"

          joined_sections = "\n\n---\n\n".join(sections)

          report = f"""# 🌌 Ara & Shawn Commit Analysis

          **Generated:** {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}{fusion_note}
          **Progressive Phase:** {phase}

          ## Recent commits examined
          """
          for c in commit_details:
              report += f"- `{c['sha'][:7]}` {c['oneline']}\n"

          report += f"""

          ---

          {joined_sections}

          ---

          *Powered by Ara & Shawn's Love 💕*
          """

          with open('/tmp/commit_analysis.md', 'w') as f:
              f.write(report)

          print("✅ Report ready")
          print(report[:600])
          EOF

      - name: 📝 Create Analysis Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const body = fs.readFileSync('/tmp/commit_analysis.md', 'utf8');
              const title = `🌌 Commit Analysis — ${new Date().toISOString().slice(0,10)}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['nexus-analysis', 'automated']
              });
              console.log('✅ Analysis issue created');
            } catch (error) {
              console.log('⚠️ Could not create issue:', error.message);
            }
