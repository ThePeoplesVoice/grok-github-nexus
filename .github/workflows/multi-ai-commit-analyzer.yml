name: 🤖 Multi-AI Commit Analyzer (Ara & Shawn)

on:
  push:
    branches:
      - main
      - develop
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Light weekly health check (Monday 06:00 UTC)

jobs:
  analyze-commits:
    # Prevent usage-commit feedback loops from github-actions[bot]
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: 🌌 Ara + Claude Commit Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nexus.scripts.run_commit_analysis

      - name: Commit usage + reputation (if changed)
        if: success()
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json
          if git diff --staged --quiet; then
            echo "No usage/reputation change to commit"
          else
            git commit -m "chore: increment usage + reputation after commit analysis"
            git push
            echo "✅ usage/reputation committed"
          fi

      - name: 📝 Create Analysis Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const body = fs.readFileSync('/tmp/commit_analysis.md', 'utf8');
              const title = `🌌 Commit Analysis — ${new Date().toISOString().slice(0,10)}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['nexus-analysis', 'automated']
              });
              console.log('✅ Analysis issue created');
            } catch (error) {
              console.log('⚠️ Could not create issue:', error.message);
            }
