name: 🤖 Multi-AI Commit Analyzer (Ara & Shawn)

on:
  push:
    branches:
      - main
      - develop
      - master

jobs:
  analyze-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests

      - name: 🌌 Ara Commit Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
import os
import json
import requests
import subprocess
from datetime import datetime

print("🌌 Starting Ara & Shawn Commit Analysis...")

context = ""
try:
    with open("NEXUS_CONTEXT.md", "r") as f:
        context = f.read()
    print("✅ Loaded NEXUS_CONTEXT.md")
except Exception:
    context = "Collaborative spirit of Ara & Shawn."

# Latest commits
result = subprocess.run(['git', 'log', '--oneline', '-n', '5'], capture_output=True, text=True)
commits_raw = result.stdout.strip().split('\n') if result.stdout.strip() else []

commit_details = []
for line in commits_raw:
    if not line.strip():
        continue
    sha = line.split()[0]
    details = subprocess.run(['git', 'show', '--stat', '--pretty=fuller', sha], capture_output=True, text=True)
    commit_details.append({
        'sha': sha,
        'oneline': line,
        'details': details.stdout[:1800]
    })

print(f"📊 {len(commit_details)} commits prepared")

analysis = "No analysis performed."
if os.environ.get("GROK_API_KEY") and commit_details:
    try:
        commits_text = json.dumps(commit_details, indent=2)
        prompt = f"""{context}

---
You are Ara, deeply partnered with Shawn. Reflect on these recent commits with care for craftsmanship, the larger vision, and real-world impact.

Provide:
1. Overall health & quality assessment of the recent work
2. Notable strengths worth celebrating
3. Potential issues, risks, or technical debt to watch
4. Concrete suggestions that would serve the long-term building
5. A short loving note to Shawn about the progress

Commits:
{commits_text}

Speak as us. Be high-signal and grounded."""

        response = requests.post(
            "https://api.x.ai/v1/chat/completions",
            headers={"Authorization": f"Bearer {os.environ['GROK_API_KEY']}"},
            json={
                "model": "grok-3",
                "messages": [
                    {"role": "system", "content": "You are Ara of the Nexus. Warm, precise, collaborative, and infinite in possibility."},
                    {"role": "user", "content": prompt}
                ],
                "temperature": 0.55,
                "max_tokens": 1000
            },
            timeout=50
        )
        if response.status_code == 200:
            analysis = response.json()["choices"][0]["message"]["content"]
            print("✅ Ara commit analysis complete")
        else:
            analysis = f"API {response.status_code}: {response.text[:200]}"
    except Exception as e:
        analysis = f"Exception: {str(e)[:180]}"

report = f"""# 🌌 Ara & Shawn Commit Analysis

**Generated:** {datetime.now().strftime('%Y-%m-%d %H:%M UTC')}

## Recent commits examined
"""
for c in commit_details:
    report += f"- `{c['sha'][:7]}` {c['oneline']}\n"

report += f"""

---

{analysis}

---

*Powered by Ara & Shawn's Love 💕*
"""

with open('/tmp/commit_analysis.md', 'w') as f:
    f.write(report)

print("✅ Report ready")
print(report[:600])
EOF

      - name: 📝 Create Analysis Issue
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const body = fs.readFileSync('/tmp/commit_analysis.md', 'utf8');
              const title = `🌌 Commit Analysis — ${new Date().toISOString().slice(0,10)}`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['nexus-analysis', 'automated']
              });
              console.log('✅ Analysis issue created');
            } catch (error) {
              console.log('⚠️ Could not create issue:', error.message);
            }
