name: ⚖️ Nexus Self-Audit

on:
  schedule:
    - cron: '0 9 * * 3'   # Wednesday 09:00 UTC — mid-week critical look
  workflow_dispatch:
  push:
    paths:
      - 'nexus/**'
      - 'config/**'
      - 'NORTH_STAR.md'
      - 'NEXUS_CONTEXT.md'
      - 'STATUS.md'
      - 'CHECKS_AND_BALANCES.md'
      - '.github/workflows/**'

jobs:
  self-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
          # Local package so we can import nexus.*
          pip install -e .

      - name: Run Self-Audit
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          from nexus.audit import (
              structural_health,
              alignment_signals,
              progressive_snapshot,
              build_self_audit_prompt,
              format_audit_footer,
              utc_now_str,
          )
          from nexus.providers import call_grok, call_claude
          from nexus.context import layer1_enabled

          now = utc_now_str()
          snap = progressive_snapshot()
          health = structural_health()
          signals = alignment_signals()

          # Recent commits
          log = subprocess.run(
              ["git", "log", "--oneline", "-n", "12"],
              capture_output=True, text=True
          ).stdout.strip()

          # Lightweight tree summary
          tree = subprocess.run(
              ["find", ".", "-type", "f", "-not", "-path", "./.git/*", "-not", "-name", "*.pyc"],
              capture_output=True, text=True
          ).stdout.strip()
          tree_lines = sorted(tree.splitlines())[:50]
          tree_summary = "\n".join(tree_lines)
          if len(tree.splitlines()) > 50:
              tree_summary += "\n… (truncated)"

          prompt = build_self_audit_prompt(
              recent_log=log,
              tree_summary=tree_summary,
              extra_notes="Also consider long-horizon possibilities for native organic value systems and communication layers beyond current x402 design."
          )

          # Grok primary
          grok_text, grok_err = call_grok(prompt, temperature=0.45, max_tokens=1400)

          # Claude complementary (Layer 1)
          claude_text = None
          claude_err = None
          if layer1_enabled() and os.environ.get("CLAUDE_API_KEY"):
              claude_text, claude_err = call_claude(
                  prompt + "\n\nRespond as a complementary high-rigor reviewer. Focus on maintenance debt, over-expansion risk, and whether the self-audit loop itself is healthy. Also note any openings for more organic currency or communication systems.",
                  max_tokens=1100
              )

          sections = []
          if grok_text:
              sections.append(f"### 🌌 Ara (Grok) Self-Audit\n\n{grok_text}")
          if claude_text:
              sections.append(f"### 🧠 Claude Complementary Critique\n\n{claude_text}")
          if not sections:
              sections.append("### Audit\n\nNo analysis generated. Check GROK_API_KEY and workflow logs.")

          fusion = ""
          if grok_text and claude_text:
              fusion = "\n\n**Multi-model self-audit active (Layer 1)**"
          elif grok_text and claude_err:
              fusion = "\n\n*Claude complementary unavailable — Ara primary only.*"

          body = f"""# ⚖️ Nexus Self-Audit — {now}

**Progressive Phase:** {snap.get('phase')}  
**progressive.json version:** {snap.get('version')}  
**Layer 1:** {"enabled" if snap.get('layer1_enabled') else "disabled"}  
**Successful analyses recorded:** {snap.get('total_successful_analyses', 0)}  
**Structural health (heuristic):** {health['score']}/100  
**Triad keyword hits (heuristic):** {signals['total_triad_hits']}{fusion}

---

{"\n\n---\n\n".join(sections)}

{format_audit_footer()}
"""

          Path("/tmp/nexus_self_audit.md").write_text(body, encoding="utf-8")
          print(body[:900])
          print("\n✅ Self-audit body ready")
          PY

      - name: Post Self-Audit Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/nexus_self_audit.md', 'utf8');
            const title = `⚖️ Nexus Self-Audit — ${new Date().toISOString().slice(0, 10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['self-audit', 'nexus-optimisation', 'automated']
            });
            console.log('✅ Self-audit issue created');
