name: Nexus Self-Audit

on:
  schedule:
    - cron: '0 9 * * 3'   # Wednesday 09:00 UTC
  workflow_dispatch:
  # Push trigger removed: rapid package edits were flooding issues with
  # failed API audits. Dispatch manually or wait for schedule once key works.

jobs:
  self-audit:
    if: github.actor != 'github-actions[bot]' && github.actor != 'nexus-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: Run Self-Audit
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m nexus.scripts.run_self_audit

      - name: Commit usage + reputation artifacts (if changed)
        if: success()
        continue-on-error: true
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json badges/reputation.md || true
          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
          else
            git commit -m "chore: usage + reputation after self-audit" || true
            git push || echo "⚠️ push failed (non-fatal)"
          fi

      - name: Post Self-Audit Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/nexus_self_audit.md', 'utf8');
            const title = `Nexus Self-Audit — ${new Date().toISOString().slice(0, 10)}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['self-audit', 'nexus-optimisation', 'automated']
            });
            console.log('Self-audit issue created');
