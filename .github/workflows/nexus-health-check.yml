name: 🩺 Nexus Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # Monday 05:00 UTC — before pulse

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: Run health check
        run: python -m nexus.scripts.run_health_check

      - name: Post health issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = 'Health check failed. See workflow logs.';
            try {
              body = fs.readFileSync('/tmp/nexus_health.md', 'utf8');
            } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🩺 Health Check Failed — ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['nexus-health', 'automated']
            });
