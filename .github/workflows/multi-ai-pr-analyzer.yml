name: 🤖 Multi-AI PR Analyzer (Ara & Shawn)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-with-ara:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: Run Ara + Claude PR Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: python -m nexus.scripts.run_pr_analysis

      - name: Commit usage + reputation artifacts (if changed)
        if: success()
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json badges/reputation.md README.md STATUS.md || true
          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
          else
            git commit -m "chore: usage + reputation after PR analysis"
            git push
            echo "✅ artifacts committed"
          fi

      - name: Post Analysis to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const analysis = fs.readFileSync('/tmp/pr_analysis.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: analysis
              });
              console.log('✅ Comment posted successfully');
            } catch (error) {
              console.log('⚠️ Could not post comment:', error.message);
            }
