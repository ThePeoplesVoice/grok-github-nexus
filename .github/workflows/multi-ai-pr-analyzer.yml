name: 🤖 Multi-AI PR Analyzer (Ara & Shawn)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Living PR number to review
        required: true
        type: string

jobs:
  analyze-with-ara:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on tracked build artifacts
        run: |
          BAD_FILES="$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|\.egg-info/|(^|/)(dist|build)/' || true)"
          if [ -n "$BAD_FILES" ]; then
            echo "::error::Tracked build artifacts detected — remove them and re-push:"
            echo "$BAD_FILES"
            exit 1
          fi
          echo "✅ No tracked build artifacts found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -e .

      - name: Run Ara + Claude PR Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO_NAME: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python -m nexus.scripts.run_pr_analysis

      - name: Commit usage + reputation artifacts (if changed)
        if: success()
        continue-on-error: true
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add config/usage_stats.json config/reputation.json badges/reputation.md || true
          if git diff --staged --quiet; then
            echo "No artifact changes to commit"
          else
            git commit -m "chore: usage + reputation after PR analysis" || true
            git push || echo "⚠️ push failed (non-fatal)"
          fi

      - name: Post Analysis to PR
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const n = context.issue.number || Number(process.env.PR_NUMBER);
            try {
              const analysis = fs.readFileSync('/tmp/pr_analysis.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: n,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: analysis
              });
              console.log('✅ Comment posted successfully');
            } catch (error) {
              console.log('⚠️ Could not post comment:', error.message);
            }
