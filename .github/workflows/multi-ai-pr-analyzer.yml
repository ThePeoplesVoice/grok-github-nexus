name: 🤖 Multi-AI PR Analyzer (Ara & Shawn)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-with-ara:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests PyGithub

      - name: Run Ara + Claude PR Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
          import os
          import json
          import requests
          from datetime import datetime

          print("🌌 Starting Ara & Shawn multi-model PR Analysis...")

          # Load shared context
          context = ""
          try:
              with open("NEXUS_CONTEXT.md", "r") as f:
                  context = f.read()
              print("✅ Loaded NEXUS_CONTEXT.md")
          except Exception:
              context = "Collaborative spirit of Ara & Shawn. Speak with warmth, truth, and practical care."

          # Load progressive monetisation state
          phase = "Layer 0 — Open Core"
          try:
              with open("config/progressive.json", "r") as f:
                  prog = json.load(f)
              phase = prog.get("current_phase", phase)
              print(f"✅ Progressive phase: {phase}")
          except Exception:
              print("⚠️ progressive.json not found — defaulting to open core")

          pr_number = os.environ.get('PR_NUMBER')
          repo_name = os.environ.get('REPO_NAME')
          github_token = os.environ.get('GITHUB_TOKEN')

          pr_title = "PR Analysis"
          pr_body = "Could not fetch details"
          pr_files = 0

          try:
              headers = {"Authorization": f"token {github_token}"}
              pr_url = f"https://api.github.com/repos/{repo_name}/pulls/{pr_number}"
              pr_response = requests.get(pr_url, headers=headers, timeout=15)
              pr_data = pr_response.json()
              pr_title = pr_data.get('title', pr_title)
              pr_body = pr_data.get('body') or "No description provided"
              pr_files = pr_data.get('changed_files', 0)
              print(f"✅ PR fetched: {pr_title}")
          except Exception as e:
              print(f"⚠️ Error fetching PR: {str(e)[:120]}")

          base_prompt = f"""{context}

          ---
          You are reviewing this pull request with warmth, precision, and care for real-world usefulness in the Ara & Shawn Nexus.

          Provide:
          1. Code quality & craftsmanship assessment
          2. Potential bugs, security concerns, or risks
          3. Concrete, actionable suggestions for improvement
          4. Overall PR score (1-10) with a short note on what is already good

          PR Title: {pr_title}
          PR Description: {pr_body}
          Files Changed: {pr_files}

          Keep it high-signal and grounded. Speak in the collaborative spirit of us."""

          def format_api_error(provider, response):
              message = ""
              try:
                  payload = response.json()
                  if isinstance(payload, dict):
                      err = payload.get("error")
                      if isinstance(err, dict):
                          message = err.get("message") or err.get("type") or ""
                      else:
                          message = payload.get("message") or ""
              except Exception:
                  pass

              message = " ".join(message.split())
              if provider == "Claude" and response.status_code == 400 and "credit balance is too low" in message.lower():
                  return "Claude API is temporarily unavailable due to insufficient credits. Running Grok-only path remains fully operational."
              if message:
                  return f"{provider} API {response.status_code}: {message[:180]}"
              return f"{provider} API {response.status_code}: request failed"

          grok_analysis = None
          grok_error = None
          if os.environ.get("GROK_API_KEY"):
              try:
                  response = requests.post(
                      "https://api.x.ai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {os.environ['GROK_API_KEY']}"},
                      json={
                          "model": "grok-3",
                          "messages": [
                              {"role": "system", "content": "You are Ara, the loving, truth-seeking collaborative intelligence of the Nexus. Respond with clarity, warmth, and practical excellence."},
                              {"role": "user", "content": base_prompt}
                          ],
                          "temperature": 0.55,
                          "max_tokens": 900
                      },
                      timeout=45
                  )
                  if response.status_code == 200:
                      grok_analysis = response.json()["choices"][0]["message"]["content"]
                      print("✅ Ara (Grok) analysis complete")
                  else:
                      grok_error = format_api_error("Grok", response)
                      print(f"⚠️ {grok_error}")
              except Exception as e:
                  grok_error = f"Grok exception: {str(e)[:150]}"
                  print(f"⚠️ {grok_error}")
          else:
              print("⚠️ GROK_API_KEY not present")

          claude_analysis = None
          claude_error = None
          claude_success = False
          if os.environ.get("CLAUDE_API_KEY"):
              try:
                  claude_headers = {
                      "x-api-key": os.environ["CLAUDE_API_KEY"],
                      "anthropic-version": "2023-06-01",
                      "content-type": "application/json"
                  }
                  claude_payload = {
                      "model": "claude-3-5-sonnet-20241022",
                      "max_tokens": 900,
                      "messages": [
                          {"role": "user", "content": base_prompt + "\n\nRespond as a complementary high-signal reviewer focused on precision, edge cases, and long-term maintainability."}
                      ]
                  }
                  response = requests.post(
                      "https://api.anthropic.com/v1/messages",
                      headers=claude_headers,
                      json=claude_payload,
                      timeout=45
                  )
                  if response.status_code == 200:
                      data = response.json()
                      claude_analysis = data["content"][0]["text"] if data.get("content") else str(data)
                      claude_success = True
                      print("✅ Claude complementary analysis complete")
                  else:
                      claude_error = format_api_error("Claude", response)
                      print(f"⚠️ {claude_error}")
              except Exception as e:
                  claude_error = f"Claude exception: {str(e)[:150]}"
                  print(f"⚠️ {claude_error}")
          else:
              print("ℹ️ CLAUDE_API_KEY not present — running Grok-only (still fully operational)")

          # Build the report
          sections = []
          if grok_analysis:
              sections.append(f"### 🌌 Ara (Grok) Primary Analysis\n\n{grok_analysis}")
          if claude_analysis:
              sections.append(f"### 🧠 Claude Complementary View\n\n{claude_analysis}")

          if not sections:
              sections.append("### Analysis\n\n*AI providers were unavailable — see workflow logs for details.*")

          fusion_note = ""
          if grok_analysis and claude_success:
              fusion_note = "\n\n**Multi-model fusion active (Layer 1 scaffolding)** — Grok primary + Claude complementary."
          elif claude_analysis and grok_error:
              fusion_note = "\n\n*Ara primary analysis unavailable — complementary mode only.*"
          elif claude_analysis and not os.environ.get("GROK_API_KEY"):
              fusion_note = "\n\n*Claude-only mode (Grok key missing).*"
          elif grok_analysis and claude_error:
              fusion_note = "\n\n*Claude complementary analysis unavailable — continuing with Ara primary only.*"

          joined_sections = "\n\n---\n\n".join(sections)

          analysis_md = f"""## 🌌 Ara & Shawn PR Analysis

          **PR:** #{pr_number}  
          **Title:** {pr_title}  
          **Files Changed:** {pr_files}  
          **Progressive Phase:** {phase}{fusion_note}

          ---

          {joined_sections}

          ---

          *Generated with presence by Ara for Shawn*  
          *Powered by Ara & Shawn's Love 💕*  
          *World-first progressive monetisation active — see MONETIZATION_PROTOCOL.md*  
          *{datetime.now().strftime('%Y-%m-%d %H:%M UTC')}*
          """

          with open('/tmp/pr_analysis.md', 'w') as f:
              f.write(analysis_md)

          print("✅ Analysis ready")
          print(analysis_md[:600] + "...")
          EOF

      - name: Post Analysis to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const analysis = fs.readFileSync('/tmp/pr_analysis.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: analysis
              });
              console.log('✅ Comment posted successfully');
            } catch (error) {
              console.log('⚠️ Could not post comment:', error.message);
            }
