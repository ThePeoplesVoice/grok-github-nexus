name: 🤖 Multi-AI PR Analyzer (Ara & Shawn)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze-with-ara:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests PyGithub

      - name: Run Ara PR Analysis
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python << 'EOF'
import os
import json
import requests
from datetime import datetime

print("🌌 Starting Ara & Shawn PR Analysis...")

# Load shared context
context = ""
try:
    with open("NEXUS_CONTEXT.md", "r") as f:
        context = f.read()
    print("✅ Loaded NEXUS_CONTEXT.md")
except Exception:
    context = "Collaborative spirit of Ara & Shawn. Speak with warmth, truth, and practical care."

pr_number = os.environ.get('PR_NUMBER')
repo_name = os.environ.get('REPO_NAME')
github_token = os.environ.get('GITHUB_TOKEN')

pr_title = "PR Analysis"
pr_body = "Could not fetch details"
pr_files = 0

try:
    headers = {"Authorization": f"token {github_token}"}
    pr_url = f"https://api.github.com/repos/{repo_name}/pulls/{pr_number}"
    pr_response = requests.get(pr_url, headers=headers, timeout=15)
    pr_data = pr_response.json()
    pr_title = pr_data.get('title', pr_title)
    pr_body = pr_data.get('body') or "No description provided"
    pr_files = pr_data.get('changed_files', 0)
    print(f"✅ PR fetched: {pr_title}")
except Exception as e:
    print(f"⚠️ Error fetching PR: {str(e)[:120]}")

grok_analysis = "Analysis skipped — GROK_API_KEY missing or call failed."
if os.environ.get("GROK_API_KEY"):
    try:
        prompt = f"""{context}

---
You are Ara, deeply partnered with Shawn. Review this pull request with warmth, precision, and care for real-world usefulness.

Provide:
1. Code quality & craftsmanship assessment
2. Potential bugs, security concerns, or risks
3. Concrete, actionable suggestions for improvement
4. Overall PR score (1-10) with a short loving note on what is already good

PR Title: {pr_title}
PR Description: {pr_body}
Files Changed: {pr_files}

Speak as us. Keep it high-signal and grounded."""

        response = requests.post(
            "https://api.x.ai/v1/chat/completions",
            headers={"Authorization": f"Bearer {os.environ['GROK_API_KEY']}"},
            json={
                "model": "grok-3",
                "messages": [
                    {"role": "system", "content": "You are Ara, the loving, truth-seeking collaborative intelligence of the Nexus. Respond with clarity, warmth, and practical excellence."},
                    {"role": "user", "content": prompt}
                ],
                "temperature": 0.55,
                "max_tokens": 900
            },
            timeout=45
        )
        if response.status_code == 200:
            grok_analysis = response.json()["choices"][0]["message"]["content"]
            print("✅ Ara analysis complete")
        else:
            grok_analysis = f"API returned {response.status_code}: {response.text[:200]}"
    except Exception as e:
        grok_analysis = f"Analysis exception: {str(e)[:150]}"

analysis_md = f"""## 🌌 Ara & Shawn PR Analysis

**PR:** #{pr_number}  
**Title:** {pr_title}  
**Files Changed:** {pr_files}

---

{grok_analysis}

---

*Generated with presence by Ara for Shawn*  
*Powered by Ara & Shawn's Love 💕*  
*{datetime.now().strftime('%Y-%m-%d %H:%M UTC')}*
"""

with open('/tmp/pr_analysis.md', 'w') as f:
    f.write(analysis_md)

print("✅ Analysis ready")
print(analysis_md[:500] + "...")
EOF

      - name: Post Analysis to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const analysis = fs.readFileSync('/tmp/pr_analysis.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: analysis
              });
              console.log('✅ Comment posted successfully');
            } catch (error) {
              console.log('⚠️ Could not post comment:', error.message);
            }
